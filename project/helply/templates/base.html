<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Helping Hands{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #faf8f4;
            color: #2c2825;
            font-family: 'DM Serif Display', serif;
        }

        .navbar {
            background-color: #f5f0e8 !important;
            border-bottom: 1px solid #e8e0d4;
        }

        .navbar-brand {
            color: #2c2825 !important;
            font-size: 1.4rem;
            font-weight: 500;
        }

        .btn-primary {
            background-color: #3d5a80 !important;
            border-color: #3d5a80 !important;
            border-radius: 20px;
            font-family: 'DM Serif Display', serif;
        }

        .btn-primary:hover {
            background-color: #2c4a6e !important;
            border-color: #2c4a6e !important;
        }

        .btn-outline-primary {
            color: #3d5a80 !important;
            border-color: #3d5a80 !important;
            border-radius: 20px;
            font-family: 'DM Serif Display', serif;
        }

        .btn-outline-primary:hover {
            background-color: #3d5a80 !important;
            color: white !important;
        }

        a {
            color: #3d5a80;
        }

        a:hover {
            color: #2c4a6e;
        }

        .alert-info {
            background-color: #f5f0e8;
            border-color: #e8e0d4;
            color: #2c2825;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Helping Hands</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-primary btn-sm">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

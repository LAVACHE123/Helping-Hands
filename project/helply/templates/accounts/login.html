{% extends 'base.html' %}
{% block title %}Log in — Helping Hands{% endblock %}

{% block content %}
<div class="page__narrow" style="padding-top:60px;">
    <div class="card">
        <div class="card-body">
            <h2 style="margin-bottom:4px;">Log in</h2>
            <p style="color:var(--muted);font-size:.9rem;margin-bottom:28px;">Welcome back.</p>

            {% if error %}
                <div class="alert alert-danger mb-4">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px;">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" value="{{ username }}"
                           placeholder="your username" class="form-control">
                </div>
                <div style="margin-bottom:24px;">
                    <label class="form-label">Password</label>
                    <input type="password" name="password"
                           placeholder="••••••••" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>

            <div style="text-align:center;margin-top:20px;">
                <span style="color:var(--muted);font-size:.85rem;">
                    No account? <a href="{% url 'register' %}">Register</a>
                </span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
